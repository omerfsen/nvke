---
namespace: omerfsen
name: nvke
version: 0.1.0
readme: README.md
authors:
  - Omer Sen
description: >-
  Install NVIDIA Kubernetes Engine (NVKE) management clusters: build the
  reference node image, prepare TPM-attested nodes, and bootstrap a highly
  available cluster behind a BGP-announced VIP, with VM provisioning on
  KVM/libvirt.
license:
  - Apache-2.0

tags:
  - nvke
  - nvidia
  - kubernetes
  - k8s
  - gpu
  - ubuntu
  - infrastructure
  - libvirt
dependencies: {}
repository: https://github.com/omerfsen/nvke
documentation: https://github.com/omerfsen/nvke/blob/main/README.md
issues: https://github.com/omerfsen/nvke/issues
build_ignore:
  - "*.qcow2"
  - "*.img"
  - "*.iso"
  - "*.raw"
  - "*.vmdk"
  - .keys
  - "*_ed25519"
  - "*_ed25519.pub"
  - "*.key"
  - "*.kubeconfig"
  - "*.token"
  - "*.local.yml"
  - inventory/*/group_vars/all/local.yml
  - inventory/*/host_vars
  - __pycache__
  - "*.pyc"
  - .venv
  - .collections
  - .git
  - .github
  - .gitignore
  - graphify-out
  - tools
  - .ansible
  - .ansible-lint
  - Makefile
  - requirements.txt
  - ansible.cfg
  - "*.tar.gz"
  - version.txt
  - importer_result.json
  - release-please-config.json
  - .release-please-manifest.json
