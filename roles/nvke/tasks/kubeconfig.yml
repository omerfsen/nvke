---
# The bootstrap's break-glass admin kubeconfig (a client certificate bound
# to cluster-admin, valid one year) for the controller, pointed at the VIP or
# the single node. Its cluster, user and context are all named
# after the cluster (nvke_cluster_name), so several NVKE clusters never
# collide. Written to nvke_kubeconfig_dest (unless empty) and, with nvke_kubeconfig_merge,
# merged into the main kubeconfig: entries of the same name are replaced, all
# others kept, and a backup is taken first. Plain YAML on the controller: no
# kubectl needed there.

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: "{{ nvke_site_kubeconfig }}"
  register: nvke_admin_conf
  no_log: true

- name: Build the exported kubeconfig
  ansible.builtin.set_fact:
    nvke_kubeconfig: >-
      {%- set src = nvke_admin_conf.content | b64decode | from_yaml -%}
      {%- set name = nvke_cluster_name -%}
      {{ {
           'apiVersion': 'v1',
           'kind': 'Config',
           'preferences': {},
           'clusters': [{'name': name, 'cluster': src.clusters[0].cluster}],
           'users': [{'name': name, 'user': src.users[0].user}],
           'contexts': [{'name': name, 'context': {'cluster': name, 'user': name}}],
           'current-context': name
         } }}
  no_log: true

- name: Write the standalone kubeconfig
  when: nvke_kubeconfig_dest | length > 0
  block:
    - name: Does the kubeconfig directory exist on the controller?
      ansible.builtin.stat:
        path: "{{ nvke_kubeconfig_dest | expanduser | dirname }}"
      delegate_to: localhost
      become: false
      register: nvke_kubeconfig_dir

    # Created when missing; an existing directory (e.g. ~/.kube) keeps its mode.
    - name: Create the kubeconfig directory
      ansible.builtin.file:
        path: "{{ nvke_kubeconfig_dest | expanduser | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: not nvke_kubeconfig_dir.stat.exists

    - name: Write it to {{ nvke_kubeconfig_dest }}
      ansible.builtin.copy:
        dest: "{{ nvke_kubeconfig_dest | expanduser }}"
        content: "{{ nvke_kubeconfig | to_nice_yaml(indent=2) }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

- name: Merge it into the main kubeconfig
  when: nvke_kubeconfig_merge | bool
  delegate_to: localhost
  become: false
  block:
    - name: Read the main kubeconfig
      ansible.builtin.slurp:
        src: "{{ nvke_kubeconfig_merge_path | expanduser }}"
      register: nvke_main_kubeconfig
      failed_when: false
      no_log: true

    - name: Merge (same names replaced, the rest kept)
      ansible.builtin.set_fact:
        nvke_merged_kubeconfig: >-
          {%- set old = (nvke_main_kubeconfig.content | b64decode | from_yaml)
                        if nvke_main_kubeconfig.content is defined else {} -%}
          {%- set old = old if old is mapping else {} -%}
          {%- set name = nvke_cluster_name -%}
          {%- set merged = old | combine({
                'apiVersion': 'v1',
                'kind': 'Config',
                'clusters': (old.clusters | default([], true) | rejectattr('name', 'eq', name) | list) + nvke_kubeconfig.clusters,
                'users': (old.users | default([], true) | rejectattr('name', 'eq', name) | list) + nvke_kubeconfig.users,
                'contexts': (old.contexts | default([], true) | rejectattr('name', 'eq', name) | list) + nvke_kubeconfig.contexts}) -%}
          {%- if nvke_kubeconfig_set_current | bool or not old['current-context'] | default('') -%}
          {%-   set merged = merged | combine({'current-context': name}) -%}
          {%- endif -%}
          {{ merged }}
      no_log: true

    - name: Write the main kubeconfig (backup first)
      ansible.builtin.copy:
        dest: "{{ nvke_kubeconfig_merge_path | expanduser }}"
        content: "{{ nvke_merged_kubeconfig | to_nice_yaml(indent=2) }}"
        mode: "0600"
        backup: true
      no_log: true
