---
argument_specs:
  main:
    short_description: NVIDIA GPU Operator on an NVKE cluster, proven with a CUDA pod.
    description:
      - The NVKE node image carries no GPU driver; the NVIDIA GPU Operator installs it, the container toolkit and the device plugin.
      - Installs the chart AICR pins (NVIDIA AI Cluster Runtime) from a checksum-verified download, with the toolkit values
      - AICR's NVKE recipe uses (the toolkit reads containerd's config file, and only a GPU request reaches a GPU).
      - Installs or upgrades only when the release's chart or values differ. Then waits for every operand,
      - checks the GPUs are allocatable, and runs a CUDA vectorAdd pod on one, deleting it afterwards.
      - Runs on a host with helm, kubectl and the cluster's admin kubeconfig, such as the NVKE bootstrap host.
    author: Omer Sen
    options:
      gpu_operator_kubeconfig:
        type: str
        required: true
        description: Path of the cluster's admin kubeconfig on the target host.
      gpu_operator_version:
        type: str
        default: v26.7.2
        description: GPU Operator chart version. Change O(gpu_operator_chart_sha256) with it.
      gpu_operator_chart_url:
        type: str
        default: https://helm.ngc.nvidia.com/nvidia/charts/gpu-operator-{{ gpu_operator_version }}.tgz
        description: Where the chart is downloaded from.
      gpu_operator_chart_sha256:
        type: str
        default: a94a88628a90fac1df8d47469baf14dd352126553f30fd1ecd8e182516ae1bf6
        description: SHA-256 of the chart archive.
      gpu_operator_namespace:
        type: str
        default: gpu-operator
        description: Namespace of the release, labelled to admit privileged pods.
      gpu_operator_release:
        type: str
        default: gpu-operator
        description: Helm release name.
      gpu_operator_driver_version:
        type: str
        default: "595.91.07"
        description:
          - NVIDIA driver the operator builds on each GPU node. A driver image for the node's Ubuntu release must exist
          - (C(nvcr.io/nvidia/driver:<version>-ubuntu26.04) for the default node image).
      gpu_operator_values:
        type: dict
        default: {}
        description: More chart values, merged over the role's.
      gpu_operator_helm:
        type: path
        default: /usr/local/bin/helm
        description: helm on the target host.
      gpu_operator_kubectl:
        type: path
        default: /usr/local/bin/kubectl
        description: kubectl on the target host.
      gpu_operator_workdir:
        type: path
        default: /var/lib/nvke/gpu-operator
        description: Where the chart and the values file are kept.
      gpu_operator_timeout_minutes:
        type: int
        default: 30
        description: How long to wait for every operand to be ready; the driver is built on each GPU node.
      gpu_operator_expected_gpus:
        type: int
        default: 1
        description: GPUs the cluster must offer as C(nvidia.com/gpu), summed over its nodes.
      gpu_operator_smoke_test:
        type: bool
        default: true
        description: Run a CUDA vectorAdd pod on one GPU after the install, then delete it.
      gpu_operator_smoke_test_image:
        type: str
        default: >-
          nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04@sha256:7c7540bdf1f942d4fb6db97069fd6c289471b54ac29e3c7fcdf914cf77af7d41
        description: The test image, pinned by digest.
