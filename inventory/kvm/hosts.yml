---
# NVKE on KVM/libvirt. kvm_hosts are the hypervisors; the NVKE nodes and the
# bootstrap host are VMs that omerfsen.nvke.kvm creates on them and adds to
# the nvke_nodes and nvke_bootstrap groups at run time. The first kvm_hosts
# host also builds the node image and runs the BGP peer for the API VIP.
all:
  children:
    kvm_hosts:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    nvke_bootstrap:
    nvke_nodes:
