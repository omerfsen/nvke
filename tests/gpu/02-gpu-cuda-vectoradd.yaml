# A real CUDA kernel: NVIDIA's vectorAdd sample adds two vectors on the GPU
# and exits non-zero if the result is wrong.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-cuda-vectoradd
  namespace: nvke-gpu-tests
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04@sha256:7c7540bdf1f942d4fb6db97069fd6c289471b54ac29e3c7fcdf914cf77af7d41
          resources:
            limits:
              nvidia.com/gpu: 1
